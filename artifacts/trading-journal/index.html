<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>TradeVault</title>
    <meta name="description" content="TradeVault — Premium Trading Journal. Track trades, analyze performance, and grow as a trader." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="TradeVault" />
    <meta property="og:description" content="Premium Trading Journal" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeVault" />
    <meta name="twitter:description" content="Premium Trading Journal" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Dancing+Script:wght@400;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <!-- Anti-FOUC: apply stored theme before first paint -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tj-theme');
          var html = document.documentElement;
          if (t === 'light') {
            html.classList.remove('dark');
            html.classList.add('light');
          } else {
            html.classList.add('dark');
            html.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>
    <!--
      Last-resort boot safety net. Runs before /src/main.tsx even loads, so it
      catches failures that happen too early for React (or main.tsx's own
      try/catch around the App import) to handle — e.g. the module script
      itself failing to load/parse, or a truly global error/rejection fired
      before the app mounts. It self-removes once the app has actually
      rendered something into #root, so it never masks a working app.
    -->
    <script>
      (function () {
        var shown = false;
        function showBootError(label, detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return; // app already mounted something — not a boot failure
          shown = true;
          console.error('[boot-safety-net] ' + label, detail);
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:#0b0b0f;color:#f4f4f5;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:999999;">' +
            '<div style="font-size:18px;font-weight:600;">The app failed to start.</div>' +
            '<div style="font-size:13px;color:#a1a1aa;max-width:560px;">' + label + '</div>' +
            '<pre style="max-width:640px;max-height:200px;overflow:auto;text-align:left;font-size:12px;background:#18181b;border:1px solid #27272a;border-radius:8px;padding:12px;color:#fca5a5;white-space:pre-wrap;word-break:break-word;">' +
            String(detail || '').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) +
            '</pre>' +
            '<button onclick="window.location.reload()" style="margin-top:4px;padding:8px 18px;border-radius:8px;border:1px solid #3f3f46;background:#27272a;color:#f4f4f5;font-size:13px;cursor:pointer;">Reload</button>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          showBootError('A script error occurred before the app finished loading.', (e.error && e.error.stack) || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          showBootError('An unhandled promise rejection occurred before the app finished loading.', (reason && reason.stack) || reason);
        });
        // Final fallback: if nothing has painted into #root after a generous
        // timeout, something silently failed without throwing a catchable
        // error (rare, but possible with some chunk-loading edge cases).
        window.setTimeout(function () {
          showBootError(
            'The app did not finish loading in time.',
            'Nothing rendered into #root within 15s of page load.'
          );
        }, 15000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
